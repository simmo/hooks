name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  discover-packages:
    name: Discover packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build package matrix
        id: packages
        shell: bash
        run: |
          packages_json=$(find ./packages -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "packages=${packages_json}" >> "$GITHUB_OUTPUT"

  build-workspaces:
    name: Build workspaces
    needs: discover-packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build workspace packages
        run: npm --workspaces --if-present run build

      - name: Debug - List package structure
        run: find packages -maxdepth 2 -type d -name dist | head -20

      - name: Upload workspace dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: workspace-dist
          path: packages/*/dist/
          if-no-files-found: error

  test:
    name: Test
    needs:
      - discover-packages
      - build-workspaces
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.discover-packages.outputs.packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download workspace dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: workspace-dist
          path: .

      - name: Run tests
        run: npm test -- packages/${{ matrix.package }}

      - name: Run typecheck
        run: npm --workspace ./packages/${{ matrix.package }} run typecheck
